<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote Đi – Mockup khối video trang chủ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F8F8;--ink:#0C1B20;--text:#1E3238;--muted:#4A6066;--line:#DCE8E8;--jade:#0EA5A4;--jade-d:#0B7F7A;--sea:#0891B2;--soft:#E3F6F5;
 --grad:linear-gradient(135deg,#19C9A7 0%,#0EA5A4 45%,#0891B2 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block;flex-shrink:0}
img{display:block;max-width:100%}
:focus-visible{outline:2.5px solid var(--sea);outline-offset:2px}
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;border-radius:50%;filter:blur(110px)}
.mesh i:nth-child(1){width:560px;height:560px;background:#19C9A7;top:-260px;left:-220px;opacity:.24}
.mesh i:nth-child(2){width:520px;height:520px;background:#38BDF8;top:-120px;right:-240px;opacity:.18}
.mesh i:nth-child(3){width:520px;height:520px;background:#19C9A7;bottom:-300px;left:30%;opacity:.14}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.ico{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:currentColor;stroke:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;transition:transform .15s,filter .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-p{color:#fff;background:var(--grad);box-shadow:0 0 0 4px rgba(14,165,164,.14),0 12px 26px -12px rgba(8,145,178,.8)}
.btn-p:hover{filter:brightness(1.07)}
.btn-g{background:#fff;border:1.5px solid #C5D6D6;color:var(--ink)}

/* ===== section ===== */
.vs{padding:88px 0 96px}
.head{text-align:center;max-width:720px;margin:0 auto 44px}
.tag{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--jade-d);font-size:13.5px;font-weight:700}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 3px rgba(14,165,164,.2)}
.head h2{margin-top:16px;font-size:clamp(30px,4.6vw,48px);line-height:1.12;font-weight:800;letter-spacing:-.035em}
.head h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{margin-top:14px;font-size:clamp(16px,1.6vw,18px);color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:24px;align-items:stretch}

/* video frame: light frosted frame, NO dark shadow */
.frame{padding:8px;border-radius:36px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 36px 70px -46px rgba(8,145,178,.42),0 0 0 1px rgba(14,165,164,.07)}
.player{position:relative;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:#E8F0F0;container-type:inline-size;isolation:isolate;user-select:none;-webkit-user-select:none;outline:none}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;background:#EAF3F3}
.player.real video{opacity:1}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.player.started.real .poster{opacity:0;pointer-events:none}
.player:not(.started):hover .poster{transform:scale(1.025)}
.veil{position:absolute;inset:0;z-index:1;background:radial-gradient(60% 60% at 50% 52%,rgba(255,255,255,.34),transparent 72%);transition:opacity .4s;pointer-events:none}
.player.started .veil{opacity:0}
/* big play button */
.bigplay{position:absolute;left:50%;top:50%;z-index:4;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 20px 40px -16px rgba(8,145,178,.55),0 0 0 8px rgba(255,255,255,.28);transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .3s}
.bigplay::before,.bigplay::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(25,201,167,.55);animation:pulse 2.6s ease-out infinite}
.bigplay::after{animation-delay:1.3s}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.bigplay span{width:68px;height:68px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.bigplay svg{width:28px;height:28px;margin-left:4px}
.bigplay:hover{transform:scale(1.07)}
.bigplay:active{transform:scale(.96)}
.player.started .bigplay{opacity:0;pointer-events:none;transform:scale(.7)}
.dur{position:absolute;left:16px;bottom:16px;z-index:4;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.dur svg{width:13px;height:13px;color:var(--jade-d)}
.player.started .dur{display:none}
/* chapter chip */
.chip-ch{position:absolute;left:16px;top:16px;z-index:5;height:34px;padding:0 14px 0 6px;border-radius:17px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s;pointer-events:none;box-shadow:0 10px 20px -12px rgba(8,80,90,.5)}
.chip-ch b{width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12px}
.chip-ch.show{opacity:1;transform:none}
.simb{position:absolute;left:16px;top:58px;z-index:5;padding:5px 10px;border-radius:12px;background:rgba(12,27,32,.7);color:#fff;font-size:11px;font-weight:600}
/* flash + double tap */
.flash{position:absolute;left:50%;top:50%;z-index:5;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--ink);box-shadow:0 18px 36px -14px rgba(8,80,90,.5)}
.flash svg{width:32px;height:32px}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.95;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
.dbl{position:absolute;top:0;bottom:0;width:34%;z-index:3;display:grid;place-items:center;pointer-events:none;opacity:0}
.dbl.l{left:0;border-radius:0 100% 100% 0/0 50% 50% 0}.dbl.r{right:0;border-radius:100% 0 0 100%/50% 0 0 50%}
.dbl{background:rgba(255,255,255,.4);backdrop-filter:blur(3px)}
.dbl span{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--ink)}
.dbl span svg{width:26px;height:26px}
.dbl.go{animation:dbl .6s ease-out}
@keyframes dbl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
/* controls (white frosted bar) */
.ctrl{position:absolute;left:14px;right:14px;bottom:14px;z-index:7;display:flex;align-items:center;gap:4px;padding:8px 10px;border-radius:24px;background:rgba(255,255,255,.84);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 40px -22px rgba(8,80,90,.55);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}
.player.started .ctrl{opacity:1;transform:none;pointer-events:auto}
.player.idle .ctrl{opacity:0;transform:translateY(12px);pointer-events:none}
.player.idle{cursor:none}
.cb{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .15s,transform .15s}
.cb:hover{background:rgba(12,27,32,.07)}
.cb:active{transform:scale(.92)}
.cb svg{width:22px;height:22px}
.cb.pp{width:44px;height:44px;background:var(--grad);color:#fff;margin-right:2px;box-shadow:0 10px 18px -10px rgba(8,145,178,.9)}
.cb.pp:hover{background:var(--grad);filter:brightness(1.08)}
.cb.pp svg{width:20px;height:20px}
.cb.txt{width:auto;padding:0 10px;border-radius:20px;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.tm{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 8px}
.tm b{color:var(--ink);font-weight:800}
.prog{position:relative;flex:1;min-width:60px;height:34px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 6px}
.prog .tr{position:relative;width:100%;height:6px;border-radius:6px;background:rgba(12,27,32,.12);transition:height .15s;overflow:visible}
.prog:hover .tr,.prog.drag .tr{height:9px}
.prog .buf,.prog .pl{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.prog .buf{background:rgba(12,27,32,.12)}
.prog .pl{background:var(--grad);width:0}
.prog .th{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(14,165,164,.45),0 4px 8px rgba(8,50,60,.3);transform:scale(.6);transition:transform .15s}
.prog:hover .th,.prog.drag .th,.prog:focus-visible .th{transform:scale(1)}
.prog .tk{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:rgba(255,255,255,.95)}
.prog .tip{position:absolute;bottom:26px;transform:translateX(-50%);padding:6px 10px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.prog .tip b{font-variant-numeric:tabular-nums}
.prog:hover .tip,.prog.drag .tip{opacity:1}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;transition:width .2s,opacity .2s;accent-color:var(--jade);height:4px;margin:0}
.vol:hover input,.vol:focus-within input{width:74px;opacity:1;margin:0 6px 0 2px}
.menu{position:absolute;right:56px;bottom:70px;z-index:8;min-width:132px;padding:6px;border-radius:16px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:0 24px 40px -18px rgba(8,50,60,.5),0 0 0 1px rgba(12,27,32,.06);display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:38px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600}
.menu button:hover{background:#F1F6F6}
.menu button.on{color:var(--jade-d);background:var(--soft)}
.menu button svg{width:16px;height:16px;opacity:0}.menu button.on svg{opacity:1}
/* end screen */
.end{position:absolute;inset:0;z-index:6;display:none;place-items:center;background:rgba(243,248,248,.62);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.player.ended .end{display:grid}
.player.ended .ctrl{opacity:0;pointer-events:none}
.end .in{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:20px}
/* fullscreen */
.player:fullscreen,.player.pseudo{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;background:#000}
.player.pseudo{position:fixed;inset:0;z-index:999}
.player:fullscreen video{object-fit:contain;background:#000}
.player:fullscreen .ctrl,.player.pseudo .ctrl{left:20px;right:20px;bottom:20px}
@container (max-width:560px){
  .ctrl{flex-wrap:wrap;row-gap:0;padding:6px 8px 6px;left:10px;right:10px;bottom:10px;border-radius:20px}
  .prog{order:-1;flex:1 1 100%;margin:0 4px;height:28px}
  .cb.rw,.cb.fw,.cb.sp,.vol input{display:none}
  .tm{flex:1}
  .cb{width:38px;height:38px}.cb.pp{width:42px;height:42px}
  .bigplay{width:76px;height:76px;margin:-38px 0 0 -38px}.bigplay span{width:54px;height:54px}.bigplay svg{width:22px;height:22px}
  .dur{left:10px;bottom:10px}
  .chip-ch{left:10px;top:10px}
  .menu{right:46px;bottom:96px}
}

/* ===== side ===== */
.side{display:flex;flex-direction:column;gap:12px}
.chaps{list-style:none;display:flex;flex-direction:column;gap:10px;flex:1}
.chaps li{flex:1;display:flex}
.chap{position:relative;flex:1;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:22px;text-align:left;
  background:rgba(255,255,255,.74);border:1.5px solid rgba(220,232,232,.9);overflow:hidden;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chap:hover{transform:translateY(-2px);background:#fff;box-shadow:0 18px 30px -22px rgba(8,80,90,.5)}
.chap .ct{width:46px;height:46px;border-radius:15px;background:var(--soft);color:var(--jade-d);display:grid;place-items:center;flex-shrink:0;transition:background .2s,color .2s}
.chap .ct svg{width:22px;height:22px}
.chap .cn{flex:1;min-width:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.chap .tm2{font-size:12.5px;font-weight:700;color:var(--muted);padding:3px 10px;border-radius:999px;background:#EEF4F4;font-variant-numeric:tabular-nums;flex-shrink:0}
.chap .cp{position:absolute;left:0;bottom:0;height:3.5px;width:calc(var(--p,0)*100%);background:var(--grad);border-radius:0 3px 3px 0}
.chap.on{background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 0 0 5px rgba(14,165,164,.09),0 20px 34px -24px rgba(8,145,178,.7)}
.chap.on .ct{background:var(--grad);color:#fff;box-shadow:0 10px 18px -10px rgba(8,145,178,.9)}
.chap.on .tm2{background:var(--soft);color:var(--jade-d)}
.chap.done .cp{width:100%;background:rgba(14,165,164,.28)}
.chap.done .ct{background:#D5EFEC}
.cta-card{border-radius:24px;padding:16px 16px 16px 20px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;overflow:hidden}
.cta-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,rgba(255,255,255,.34),transparent 55%)}
.cta-card div{position:relative;min-width:0}
.cta-card b{display:block;font-size:17px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.cta-card span{display:block;font-size:13px;opacity:.92;margin-top:2px}
.cta-card .btn{position:relative;height:46px;background:#fff;color:var(--ink);padding:0 18px;flex-shrink:0}

/* mockup-only toolbar */
.mocktools{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:300;display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(12,27,32,.92);backdrop-filter:blur(12px);color:#fff;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.mocktools::-webkit-scrollbar{display:none}
.mocktools label{font-size:11.5px;font-weight:700;color:#8FA8AD;padding:0 6px 0 10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.mocktools button{height:32px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:700;color:#C5D6D6;white-space:nowrap}
.mocktools button.on{background:#fff;color:var(--ink)}
.mocktools hr{width:1px;height:20px;border:0;background:rgba(255,255,255,.2);margin:0 4px}
[hidden]{display:none!important}

@media (max-width:980px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .side{gap:14px;min-width:0}
  .frame{min-width:0}
  .chaps{flex-direction:row;overflow-x:auto;scroll-snap-type:x proximity;gap:10px;padding:2px 2px 6px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
  .chaps::-webkit-scrollbar{display:none}
  .chaps li{flex:0 0 auto;scroll-snap-align:start}
  .chap{padding:10px 14px 10px 10px;gap:10px}
  .chap .ct{width:40px;height:40px;border-radius:13px}
  .chap .cn{font-size:15px;white-space:nowrap}
  .vs{padding:64px 0 120px}
  .head{margin-bottom:30px}
  .frame{padding:6px;border-radius:30px}.player{border-radius:24px}
}
@media (max-width:520px){
  .cta-card{flex-direction:column;align-items:stretch;text-align:left}
  .cta-card .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mesh"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></symbol>
 <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></symbol>
 <symbol id="i-replay" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.7-6.2M3.5 4v5h5"/></symbol>
 <symbol id="i-rew" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5v4.8h4.8"/><text x="12" y="15.4" text-anchor="middle" font-size="7.6" font-weight="800" font-family="Be Vietnam Pro,Arial" fill="currentColor" stroke="none">10</text></symbol>
 <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4.5v4.8h-4.8"/><text x="12" y="15.4" text-anchor="middle" font-size="7.6" font-weight="800" font-family="Be Vietnam Pro,Arial" fill="currentColor" stroke="none">10</text></symbol>
 <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
 <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5zM17 9.5l5 5M22 9.5l-5 5"/></symbol>
 <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
 <symbol id="i-xfs" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
 <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.3L19.2 10l-5.3 1.9L12 17.2l-1.9-5.3L4.8 10l5.3-1.7zM18.5 16l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
 <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
 <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
 <symbol id="i-cup" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></symbol>
 <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</defs></svg>

<section class="vs">
 <div class="wrap">
  <div class="head">
   <span class="tag"><i></i>Video 45 giây</span>
   <h2>Xem Vote Đi hoạt động<br><em>trong 45 giây</em></h2>
   <p>Từ tạo phòng đến chốt kết quả, cả nhóm chỉ cần một link.</p>
  </div>
  <div class="grid">
   <div class="frame">

const SRC='votedi-gioi-thieu.mp4';           // đặt cùng thư mục với file này để phát video thật
const CH=[{t:0,title:'Vote Đi là gì',ic:'spark'},{t:8,title:'Tạo phòng, mời bạn',ic:'link'},{t:11,title:'Các kiểu vote',ic:'layers'},{t:28,title:'Chốt và chia sẻ',ic:'cup'}];
const DUR0=45,fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const ico=(n,c='ico')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
const pl=$('#pl'),v=$('#v');
let real=false,tried=false,started=false,ended=false,simT=0,simPlay=false,rate=1,muted=false,vol=1,lastTs=performance.now(),lastMove=0,hover=false,curCh=-1,chipTO,clickTO;
/* ---------- chapters (right side) ---------- */
$('#chaps').innerHTML=CH.map((c,i)=>`<li><button class="chap" data-i="${i}" aria-label="${c.title}, bắt đầu ở ${fmt(c.t)}"><span class="ct">${ico(c.ic)}</span><span class="cn">${c.title}</span><span class="tm2">${fmt(c.t)}</span><i class="cp"></i></button></li>`).join('');
$('#chaps').onclick=e=>{const b=e.target.closest('.chap');if(!b)return;seek(CH[+b.dataset.i].t);play()};
$('#ticks').innerHTML=CH.slice(1).map(c=>`<i class="tk" style="left:${c.t/DUR0*100}%"></i>`).join('');
/* ---------- engine (real video, or simulation when the file is missing) ---------- */
const dur=()=>real&&isFinite(v.duration)?v.duration:DUR0;
const now=()=>real?v.currentTime:simT;
const playing=()=>real?(!v.paused&&!v.ended):simPlay;
async function ensure(){
  if(tried)return;tried=true;
  try{await new Promise((res,rej)=>{const to=setTimeout(()=>rej(),2500);v.onloadedmetadata=()=>{clearTimeout(to);res()};v.onerror=()=>{clearTimeout(to);rej()};v.src=SRC;v.preload='auto';v.load()});real=true;pl.classList.add('real')}
  catch(e){real=false;pl.classList.add('sim');$('#simb').hidden=false}
}
async function play(){
  if(!started){started=true;pl.classList.add('started');await ensure()}
  if(ended){seek(0);ended=false;pl.classList.remove('ended')}
  v.playbackRate=rate;v.muted=muted;v.volume=vol;
  if(real){try{await v.play()}catch(e){}}else simPlay=true;
}
function pause(){if(real)v.pause();else simPlay=false}
function toggle(){playing()?pause():play()}
function seek(t){t=clamp(t,0,dur());if(real)v.currentTime=t;else simT=t;if(t<dur()-.05&&ended){ended=false;pl.classList.remove('ended')}}
function onEnd(){ended=true;pl.classList.add('ended')}
v.onended=onEnd;
function flash(isPlay){const f=$('#flash');f.firstElementChild.innerHTML=`<use href="#i-${isPlay?'play':'pause'}"/>`;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
/* ---------- UI loop ---------- */
function ui(ts){
  const dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
  if(!real&&simPlay){simT+=dt*rate;if(simT>=DUR0){simT=DUR0;simPlay=false;onEnd()}}
  const t=now(),d=dur(),pc=clamp(t/d,0,1),on=playing();
  $('#plf').style.width=pc*100+'%';$('#thm').style.left=pc*100+'%';
  if(real&&v.buffered.length)$('#buf').style.width=clamp(v.buffered.end(v.buffered.length-1)/d,0,1)*100+'%';else $('#buf').style.width='0';
  $('#tm').innerHTML=`<b>${fmt(t)}</b> / ${fmt(d)}`;
  const pr=$('#prog');pr.setAttribute('aria-valuenow',Math.floor(t));pr.setAttribute('aria-valuetext',fmt(t)+' trên '+fmt(d));
  const ppUse=$('#ppi').firstElementChild;const want=on?'#i-pause':'#i-play';if(ppUse.getAttribute('href')!==want){ppUse.setAttribute('href',want);$('#pp').setAttribute('aria-label',on?'Tạm dừng':'Phát')}
  pl.classList.toggle('playing',on);
  let ci=0;CH.forEach((c,i)=>{if(t>=c.t)ci=i});
  document.querySelectorAll('.chap').forEach((b,i)=>{const s=CH[i].t,e=CH[i+1]?CH[i+1].t:d,f=clamp((t-s)/(e-s),0,1);b.style.setProperty('--p',started?f:0);b.classList.toggle('on',started&&i===ci);b.classList.toggle('done',started&&i<ci)});
  if(started&&ci!==curCh){curCh=ci;const c=$('#chip');c.innerHTML=`<b>${ci+1}</b><span>${CH[ci].title}</span>`;c.classList.add('show');clearTimeout(chipTO);chipTO=setTimeout(()=>c.classList.remove('show'),2400)}
  pl.classList.toggle('idle',on&&performance.now()-lastMove>2600&&!$('#menu').classList.contains('open'));
  requestAnimationFrame(ui);
}
requestAnimationFrame(ui);
/* ---------- interactions ---------- */
$('#bigplay').onclick=play;
$('#pp').onclick=()=>{toggle();flash(!playing())};
$('#again').onclick=play;
$('#rw').onclick=()=>skip(-10);$('#fw').onclick=()=>skip(10);
function skip(s){seek(now()+s);const z=$(s<0?'#dl':'#dr');z.classList.remove('go');void z.offsetWidth;z.classList.add('go')}
['pointermove','pointerdown','keydown','touchstart'].forEach(ev=>pl.addEventListener(ev,()=>{lastMove=performance.now()}));
pl.addEventListener('pointerenter',()=>hover=true);pl.addEventListener('pointerleave',()=>hover=false);
/* click on picture: play/pause (single), double = seek ±10s (sides) or fullscreen (centre) */
pl.addEventListener('click',e=>{
  if(e.target.closest('.ctrl,.bigplay,.menu,.end,.chip-ch'))return;
  if(!started){play();return}
  clearTimeout(clickTO);
  if(e.detail>=2){const r=pl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
    if(x<.33)skip(-10);else if(x>.67)skip(10);else toggleFs();return}
  clickTO=setTimeout(()=>{toggle();flash(!playing())},230);
});
/* progress scrub */
const pr=$('#prog');let drag=false,wasPlaying=false;
const tAt=e=>{const r=pr.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*dur()};
function tip(e){const t=tAt(e),r=pr.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width);let ci=0;CH.forEach((c,i)=>{if(t>=c.t)ci=i});const tp=$('#tip');tp.innerHTML=`<b>${fmt(t)}</b> · ${CH[ci].title}`;tp.style.left=clamp(x,50,r.width-50)+'px'}
pr.addEventListener('pointerdown',e=>{drag=true;pr.classList.add('drag');pr.setPointerCapture(e.pointerId);wasPlaying=playing();seek(tAt(e));tip(e)});
pr.addEventListener('pointermove',e=>{tip(e);if(drag)seek(tAt(e))});
pr.addEventListener('pointerup',e=>{if(!drag)return;drag=false;pr.classList.remove('drag');if(wasPlaying&&!ended)play()});
pr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){seek(now()+5);e.preventDefault();e.stopPropagation()}else if(e.key==='ArrowLeft'){seek(now()-5);e.preventDefault();e.stopPropagation()}});
/* speed menu */
const RATES=[0.75,1,1.25,1.5,2];
function buildMenu(){$('#menu').innerHTML=RATES.map(r=>`<button role="menuitemradio" aria-checked="${r===rate}" class="${r===rate?'on':''}" data-r="${r}">${r===1?'Bình thường':r+'×'}${ico('check')}</button>`).join('');$('#sp').textContent=rate+'×'}
buildMenu();
$('#sp').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};
$('#menu').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;rate=+b.dataset.r;if(real)v.playbackRate=rate;buildMenu();$('#menu').classList.remove('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu,#sp'))$('#menu').classList.remove('open')});
/* volume */
function applyVol(){v.muted=muted;v.volume=vol;$('#mui').firstElementChild.setAttribute('href',muted||vol===0?'#i-mute':'#i-vol');$('#mu').setAttribute('aria-label',muted?'Bật tiếng':'Tắt tiếng')}
$('#mu').onclick=()=>{muted=!muted;if(!muted&&vol===0)vol=.6,$('#vr').value=.6;applyVol()};
$('#vr').oninput=e=>{vol=+e.target.value;muted=vol===0;applyVol()};
/* fullscreen */
function toggleFs(){
  if(document.fullscreenElement){document.exitFullscreen();return}
  if(pl.requestFullscreen){pl.requestFullscreen().catch(()=>pl.classList.toggle('pseudo'))}
  else if(real&&v.webkitEnterFullscreen)v.webkitEnterFullscreen();
  else pl.classList.toggle('pseudo');
  syncFs();
}
function syncFs(){const f=!!document.fullscreenElement||pl.classList.contains('pseudo');$('#fsi').firstElementChild.setAttribute('href',f?'#i-xfs':'#i-fs');$('#fs').setAttribute('aria-label',f?'Thoát toàn màn hình':'Toàn màn hình')}
$('#fs').onclick=toggleFs;document.addEventListener('fullscreenchange',syncFs);
/* keyboard (when hovering or focused) */
document.addEventListener('keydown',e=>{
  if(!(hover||pl.contains(document.activeElement)))return;
  if(e.target.matches('input,#prog'))return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='k'){e.preventDefault();toggle();flash(!playing())}
  else if(k==='arrowright'){e.preventDefault();skip(5)}else if(k==='arrowleft'){e.preventDefault();skip(-5)}
  else if(k==='l'){skip(10)}else if(k==='j'){skip(-10)}
  else if(k==='m'){muted=!muted;applyVol()}else if(k==='f'){toggleFs()}
  else if(k==='arrowup'){e.preventDefault();vol=clamp(vol+.1,0,1);muted=false;$('#vr').value=vol;applyVol()}else if(k==='arrowdown'){e.preventDefault();vol=clamp(vol-.1,0,1);$('#vr').value=vol;applyVol()}
  else if(k==='escape')$('#menu').classList.remove('open');
});
/* ---------- mockup toolbar ---------- */
$('#mt').onclick=async e=>{
  const c=e.target.closest('[data-c]'),s=e.target.closest('[data-s]');
  if(c){$('#poster').src=COVERS[+c.dataset.c];document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b===c))}
  if(s){document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b===s));const m=s.dataset.s;
    if(m==='idle'){pause();started=false;ended=false;curCh=-1;pl.classList.remove('started','ended','playing','real');seek(0);simT=0;if(real)v.removeAttribute('src');real=false;tried=false;pl.classList.remove('sim');$('#simb').hidden=true}
    else if(m==='play'){await play();seek(14)}
    else if(m==='pause'){await play();seek(14);pause()}
    else if(m==='end'){await play();seek(dur()-.05);if(!real){simT=DUR0;simPlay=false}onEnd()}
  }
};
</script>
</body>
